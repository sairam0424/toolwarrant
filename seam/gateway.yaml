# yaml-language-server: $schema=https://agentgateway.dev/schema/config
binds:
- port: 3000
  listeners:
  - routes:
    - policies:
        mcpGuardrails:
          processors:
          - host: 127.0.0.1:9001
            kind: remote
            failureMode: failClosed
            methods:
              tools/call: request
              tools/list: response
      backends:
      - mcp:
          targets:
          - name: mock
            mcp:
              host: http://127.0.0.1:3001/mcp
