# .github/workflows/release.yml: a v* tag becomes a draft GitHub release
# (D16). Runs only after the ci workflow succeeded on the same commit; every
# action is pinned by commit SHA (the tag is a comment). The job needs
# contents: write to create the draft and id-token: write for the keyless
# cosign signature; nothing else.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: ci succeeded on this commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      actions: read
    steps:
      - name: require a successful ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          conclusions=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | map(.conclusion // "pending") | join(",")')
          echo "ci runs for ${SHA}: ${conclusions:-none}"
          case ",${conclusions}," in
            *,success,*) echo "ci succeeded on this commit" ;;
            *) echo "no successful ci run for this commit; push main, let ci pass, then tag" >&2; exit 1 ;;
          esac

  release:
    name: goreleaser release (draft)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pinned
        with:
          fetch-depth: 0 # the changelog needs every commit since the previous tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, SHA pinned
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, SHA pinned
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3, SHA pinned
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3, SHA pinned
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3, SHA pinned
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -mod=readonly
