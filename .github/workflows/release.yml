# .github/workflows/release.yml: a v* tag becomes a draft GitHub release
# (D16, D20). Runs only after the ci workflow succeeded on the same commit;
# every action is pinned by commit SHA (the tag is the bare trailing comment
# Dependabot maintains). The gate job needs actions: read to list workflow
# runs and contents: read to read the tag ref, peel the tag object
# (v0.1.0-rc.1 failed with HTTP 403 without it) and ask whether a release for
# the tag is already published; the release job needs contents: write to
# create the draft and upload the provenance bundle, id-token: write for the
# keyless cosign signature and the keyless attestation signature, and
# attestations: write to store the attestation with GitHub; nothing else.
#
# What the release job does, in order: the release notes are the tag's
# section of CHANGELOG.md (scripts/release-notes.sh; a candidate takes the
# version's section once the release commit added it, else Unreleased) and
# the job stops when that section is empty; goreleaser builds, signs and
# creates the draft with those notes between the header and footer of
# .goreleaser.yaml; actions/attest-build-provenance signs a SLSA provenance
# statement whose subjects are the archives and SBOMs the checksums file
# lists, and the bundle is uploaded to the draft as
# toolwarrant_<version>_provenance.intoto.jsonl; last, linux/amd64 is rebuilt
# with the command SECURITY.md documents and compared byte for byte with the
# archive's binary, so the documented command and the release never drift
# apart. A step that fails after goreleaser leaves a draft nobody publishes;
# a re-run on the same tag replaces it, since the gate refuses only a tag
# whose release is already published.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: ci succeeded on this commit and the tag is unreleased
    runs-on: ubuntu-latest
    permissions:
      actions: read # list the ci runs of the tagged commit
      contents: read # read the tag ref, peel the tag object and read the releases; a permissions block zeroes everything it does not name
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - name: require a successful ci run for the tagged commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # github.sha is the tag object for an annotated tag, and ci runs are
          # keyed by commit, so peel the tag through the API first.
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha + " " + .object.type')
          SHA=${ref%% *}
          if [ "${ref##* }" = tag ]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq .object.sha)
          fi
          echo "tag ${TAG} points at commit ${SHA}"
          echo "commit=${SHA}" >> "${GITHUB_OUTPUT}"
          # The newest push run of ci on main for this commit decides; an older
          # success does not outweigh a later failure, and runs of other events
          # or branches (pull requests, dispatches) do not count. The workflow
          # is selected by its file path, not its display name, so no other
          # workflow can be read as ci.
          newest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .event == "push" and .head_branch == "main")] | sort_by(.run_number) | reverse | (.[0].conclusion // "none")')
          echo "newest ci push run on main for ${SHA}: ${newest}"
          if [ "${newest}" != "success" ]; then
            echo "the newest ci push run on main for this commit is not a success (${newest}); push main, let ci pass, then tag that commit" >&2
            exit 1
          fi
      - name: refuse a tag whose release is already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # "Get a release by tag name" answers only for a published release;
          # a draft is not found by its tag. A published release is never
          # re-run, a fix is a new tag (docs/operations.md, Releasing), and
          # once immutable releases are on, the assets could not change anyway.
          # Any answer other than a release or a 404 stops the gate: a gate
          # that took an API error for "not published" would have checked
          # nothing.
          if url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .html_url 2>&1); then
            echo "a release for ${TAG} is already published (${url}); a published release is never re-run, a fix is a new tag" >&2
            exit 1
          fi
          case "${url}" in
            *"HTTP 404"*) echo "no published release for ${TAG} yet" ;;
            *) echo "could not read the releases of ${TAG}: ${url}" >&2; exit 1 ;;
          esac

  release:
    name: goreleaser release (draft), provenance and rebuild
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the tag object and the previous tag; a shallow clone is a warning we do not want in a release log
          persist-credentials: false # nothing in this job pushes; the token stays out of .git/config
      - name: the checkout is the commit the gate verified
        env:
          GATE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          set -eu
          # The gate read the tag through the API and the checkout read it
          # again from git; a tag moved between the two reads would be built
          # and signed without its ci run having been checked.
          HEAD_SHA=$(git rev-parse HEAD)
          echo "checked out ${HEAD_SHA}; the gate verified ${GATE_COMMIT}"
          if [ "${HEAD_SHA}" != "${GATE_COMMIT}" ]; then
            echo "the tag moved between the gate and the checkout; tag again and let the gate see the final commit" >&2
            exit 1
          fi
      - name: version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # goreleaser's {{ .Version }} is the tag without its v; the asset
          # names below are built from the same value, so the shape is checked
          # once here before it reaches a file name or a linker flag.
          version=${TAG#v}
          case "${version}" in
            *[!0-9A-Za-z.-]*|"") echo "tag ${TAG} is not a version tag (vX.Y.Z or vX.Y.Z-rc.N)" >&2; exit 1 ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version ${version}"
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # The script exits 1 for a missing heading or an empty section and 2
          # for a tag it does not read as a version, so no draft is created
          # with notes that are not the changelog's prose (D20 (d)).
          scripts/release-notes.sh "${TAG}" > "${RUNNER_TEMP}/release-notes.md"
          echo "--- release notes ---"
          cat "${RUNNER_TEMP}/release-notes.md"
          echo "--- end ---"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # the version the snapshot proof ran with (D16); bump deliberately
          args: check
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # the version the snapshot proof ran with (D16); bump deliberately
          # The action starts goreleaser without a shell, so the path is
          # written out as an expression; runner.temp has no spaces on the
          # GitHub runners. goreleaser reads the file in its changelog pipe
          # and the release pipe puts the header and footer around it.
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -mod=readonly
      - name: attest the archives and SBOMs the checksums file lists
        id: attest
        # Pinned to the commit the v4.2.2 tag pointed at on 2026-10-14 (gh api
        # repos/actions/attest-build-provenance/git/ref/tags/v4.2.2, a
        # lightweight tag). The action signs a SLSA provenance v1 statement
        # keyless under this workflow's identity, records it in Sigstore's
        # public Rekor log (the repository is public) and stores it with
        # GitHub for gh attestation verify; the subjects are every name and
        # SHA-256 the checksums file lists, the four archives and four SBOMs.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/toolwarrant_${{ steps.version.outputs.version }}_checksums.txt
      - name: upload the provenance bundle to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          # bundle-path is one Sigstore bundle per line (JSON lines), which is
          # what gh attestation verify --bundle reads; the .intoto.jsonl name
          # is the one the OpenSSF Scorecard Signed-Releases check looks for.
          # gh release upload resolves a draft by its tag.
          asset="dist/toolwarrant_${VERSION}_provenance.intoto.jsonl"
          cp "${BUNDLE}" "${asset}"
          test -s "${asset}"
          gh release upload "${TAG}" "${asset}"
          echo "uploaded ${asset}"
      - name: rebuild linux/amd64 with the documented command and compare
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # The command is the one SECURITY.md (Release integrity) and
          # docs/operations.md (Releasing) give a verifier, run on the same
          # commit against the archive goreleaser just built: a flag or an
          # input added to the release build that the documented command does
          # not carry fails here, not on a verifier's machine. The checkout
          # must be clean, as for the verifier; dist/ is gitignored.
          toolchain=$(sed -n 's/^toolchain //p' go.mod)
          test -n "${toolchain}"
          test -z "$(git status --short)"
          CGO_ENABLED=0 GOFLAGS=-mod=readonly GOTOOLCHAIN="${toolchain}" GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${RUNNER_TEMP}/rebuilt" ./cmd/toolwarrant
          tar -xzf "dist/toolwarrant_${VERSION}_linux_amd64.tar.gz" -C "${RUNNER_TEMP}" toolwarrant
          cmp "${RUNNER_TEMP}/rebuilt" "${RUNNER_TEMP}/toolwarrant"
          echo "linux/amd64 rebuilt from the documented command equals the archive's binary"
