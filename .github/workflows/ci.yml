# toolwarrant continuous integration.
#
# Why this file exists: SECURITY.md and docs/threat-model.md say that the lint
# set (actionlint on the workflow files included), govulncheck, gitleaks and
# the third-party notices check run in CI, and
# README.md says that every test name cited in the documents exists. This
# workflow is what makes those sentences true. Every go command runs with
# GOFLAGS=-mod=readonly so that no job can edit go.mod; a dependency change is
# a deliberate commit that also regenerates THIRD_PARTY_NOTICES.md.
#
# Action pins. Every action is pinned by the commit SHA its release tag
# resolved to on the day the line was written (gh api on the tag); the tag is
# the trailing comment, in the bare form "# vX.Y.Z" that Dependabot rewrites
# when it moves the SHA (its first bump left a comment with extra words
# behind). A tag can be moved, a commit cannot.
#
# Both test jobs run go test through gotestsum v1.13.0 (installed with go
# install at that version, like govulncheck) and end with a step that writes
# every test slower than one second to the step summary, also after a failure.
# CLAUDE.md's -short policy reads its thirty-second line off that table.
#
# The e2e job runs only on workflow_dispatch. It downloads the agentgateway
# v1.6.0 release asset for linux and checks it against the SHA-256 recorded in
# AGENTGATEWAY_SHA256 below (recorded on 2026-10-12; the job passed the same
# day on the linux runner).
#
# The requalify job runs only on a workflow_dispatch that names a candidate
# release in its inputs: scripts/requalify-gateway.sh checks the seventeen
# items of docs/operations.md "Moving the gateway pin (L7)" against that
# release, the end-to-end test included, while the e2e job keeps running
# against the pinned version. The inputs reach the script through environment
# variables, never through the run line, so a crafted input cannot become
# shell.
name: ci

# Triggers: every pull request, every push to main and a manual dispatch; the
# e2e job runs on dispatch only, the requalify job on a dispatch with the two
# inputs. README.md and SECURITY.md state the triggers in these words.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gateway_version:
        description: "agentgateway release to re-qualify (vX.Y.Z); empty runs the pinned e2e job only"
        required: false
        default: ""
      gateway_sha256:
        description: "SHA-256 of that release's agentgateway-linux-amd64 asset, as published beside it"
        required: false
        default: ""

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: gofmt, go vet, golangci-lint v2.14.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The version is the one CLAUDE.md pins. install-only leaves the run to
      # make lint, so "lint clean" means the same thing here and on a laptop.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - run: make lint
      # The committed UTS #39 confusables table (internal/textdiff/
      # confusables_table.go) must be what the generator writes from the
      # vendored data file, as the ExtMCP stubs must match the proto: a hand
      # edit of the table would change what reads as a look-alike without a
      # change to the data or its pinned version.
      - run: scripts/gen-confusables.sh --check
      # actionlint checks the five workflow files for expression and schema
      # errors on every pull request; before it, such an error surfaced only
      # when a tag ran release.yml (the v0.1.0 candidates). The release tarball is
      # pinned by its SHA-256 the way the e2e job pins the gateway asset; bump
      # the version and the digest together, Dependabot does not see this one.
      - name: actionlint v1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/nightly.yml .github/workflows/scorecard.yml .github/workflows/codeql.yml

  build:
    name: go build and go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - run: go vet -tags e2e ./e2e/...

  test:
    name: go test -race -short
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # gotestsum wraps the go test command below without changing what runs:
      # --format pkgname prints one line per package with its time and
      # coverage and the failed tests' output at the end, --jsonfile keeps the
      # -json stream for the timing table. Pinned like govulncheck; the go.sum
      # line of the module at v1.13.0 is
      # h1:+Lh454O9mu9AMG1APV4o0y7oDYKyik/3kBOiCqiEpRo= (go mod download -json
      # on 2026-10-14), which go install checks against sum.golang.org.
      - run: go install gotest.tools/gotestsum@v1.13.0
      # -short skips six tests: the three Unicode walks of internal/textdiff
      # (TestEscape_everyRune, TestEscape_coversEveryRuneTheToolNameRuleForbids,
      # TestNames_noSuspiciousRuneHasAnEmptyName), two slow catalog tests
      # (TestVerifyAudit_PagesThroughLargeLogs,
      # TestRecordCrawl_LargeCrawlDoesNotBlockADecision) and the processor's
      # gRPC size test (TestServe_AcceptsAPageOverGRPCsDefaultLimit); the
      # test-full job runs those three packages without -short.
      - run: gotestsum --format pkgname --jsonfile "$RUNNER_TEMP/gotestsum.json" -- -race -short -count=1 -timeout 900s -cover ./...
      # The timing table: every test over one second, slowest first, in the
      # step summary and the log, also when a test failed, so that a red run
      # still shows where the time went. make test-timings prints the same
      # table locally.
      - name: tests slower than 1s
        if: always()
        run: |
          set -euo pipefail
          table="$(gotestsum tool slowest --jsonfile "$RUNNER_TEMP/gotestsum.json" --threshold 1s)"
          printf '## Tests slower than 1s\n\n~~~\n%s\n~~~\n' "${table:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

  test-full:
    name: full textdiff Unicode walk, slow catalog tests and the processor gRPC size test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # gotestsum as in the test job: the same pin, the same reasons.
      - run: go install gotest.tools/gotestsum@v1.13.0
      # The three packages with a testing.Short() skip, run in full. CLAUDE.md
      # names the six tests this covers, and internal/shortpolicy's
      # TestShortPolicy_everyShortSkipIsNamedInCLAUDEAndRunsInFull fails when a
      # test consults testing.Short() without being named there or without its
      # package on this line.
      - run: gotestsum --format pkgname --jsonfile "$RUNNER_TEMP/gotestsum.json" -- -race -count=1 -timeout 1500s -cover ./internal/textdiff/ ./internal/catalog/ ./internal/processor/
      # The timing table, as in the test job.
      - name: tests slower than 1s
        if: always()
        run: |
          set -euo pipefail
          table="$(gotestsum tool slowest --jsonfile "$RUNNER_TEMP/gotestsum.json" --threshold 1s)"
          printf '## Tests slower than 1s\n\n~~~\n%s\n~~~\n' "${table:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Installed at a pinned module version rather than @latest so that a new
      # govulncheck release cannot change what this job does without a commit.
      # v1.1.4 panicked in its SSA builder on Go 1.27 code (first run on the
      # runner); v1.9.0 handles it and found no vulnerabilities on 2026-10-12.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request the action lists the request's commits through the
      # API, which the default contents: read token may not do (403 on the
      # first pull request of this repository).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
          fetch-depth: 0 # the whole history: a secret that was ever committed counts
      # The action is free for personal repositories; an organisation
      # repository needs GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notices:
    name: scripts/gen-third-party-notices.sh --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      # Section 3 of THIRD_PARTY_NOTICES.md states a licence only for the
      # graph-only modules that were in the module cache when the file was
      # generated. A fresh runner has none of them, so download exactly those
      # (derived from the committed file, not a list kept here) before the
      # check compares like with like.
      - name: download the graph-only modules the notices file inspected
        run: |
          mods=$(awk '/^## 3\./{s=1} /^## 4\./{s=0} s && /^\| `/ && / \| yes \| / { gsub(/`/,"",$2); print $2"@"$4 }' THIRD_PARTY_NOTICES.md)
          echo "$mods"
          # shellcheck disable=SC2086
          go mod download $mods
      - run: scripts/gen-third-party-notices.sh --check

  release-check:
    name: goreleaser check and the schema version in the release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - run: make release-check

  docs:
    name: cited tests and relative links exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - name: every test name cited in the documents is a test function
        run: |
          set -euo pipefail
          fail=0
          while read -r n; do
            if ! grep -rqE "^func $n\(" --include='*_test.go' --exclude-dir=.git .; then
              echo "cited test does not exist: $n"
              fail=1
            fi
          done < <(grep -ohE '\b(Test|Fuzz)[A-Z_][A-Za-z0-9_]*' README.md SECURITY.md CONTRIBUTING.md CLAUDE.md CHANGELOG.md docs/*.md seam/RESULTS.md | sort -u)
          exit "$fail"
      - name: every relative link resolves
        run: |
          set -euo pipefail
          fail=0
          while IFS=: read -r file link; do
            target=${link%%#*}
            [ -n "$target" ] || continue
            case "$target" in http://*|https://*|mailto:*) continue ;; esac
            if [ ! -e "$(dirname "$file")/$target" ]; then
              echo "broken link in $file: $link"
              fail=1
            fi
          done < <(grep -oHE '\]\([^)]+\)' README.md SECURITY.md CONTRIBUTING.md CLAUDE.md CHANGELOG.md docs/*.md seam/RESULTS.md | sed -E 's/\]\((.*)\)$/\1/')
          exit "$fail"

  e2e:
    name: end-to-end on the agentgateway v1.6.0 release binary (dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AGENTGATEWAY_VERSION: v1.6.0
      # The linux asset name of the release; the darwin asset the laptops use
      # is agentgateway-darwin-arm64. Adjust if the release names it otherwise.
      AGENTGATEWAY_ASSET: agentgateway-linux-amd64
      # The SHA-256 of the asset named above, as the release publishes it in
      # agentgateway-linux-amd64.sha256 and as the GitHub API reports the
      # asset's digest (both read on 2026-10-12, and they agree). The job
      # refuses to run with a placeholder value, so a moved pin needs a new
      # checksum here.
      AGENTGATEWAY_SHA256: 496ed27e6a96b55a9ad7cabe5c2be7172511f44a3cb113e533d22bf93a7f079d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: download the gateway and verify its checksum
        run: |
          set -euo pipefail
          case "$AGENTGATEWAY_SHA256" in
            REPLACE_WITH_*) echo "AGENTGATEWAY_SHA256 is the placeholder; record the release checksum first" >&2; exit 1 ;;
          esac
          mkdir -p .cache
          curl -fsSL --retry 3 -o .cache/agentgateway \
            "https://github.com/agentgateway/agentgateway/releases/download/${AGENTGATEWAY_VERSION}/${AGENTGATEWAY_ASSET}"
          echo "${AGENTGATEWAY_SHA256}  .cache/agentgateway" | sha256sum -c -
          chmod +x .cache/agentgateway
          .cache/agentgateway --version || true
      - name: make e2e
        env:
          TOOLWARRANT_GATEWAY_BIN: ${{ github.workspace }}/.cache/agentgateway
          TOOLWARRANT_E2E_WORKDIR: ${{ runner.temp }}/toolwarrant-e2e
        run: |
          mkdir -p "$TOOLWARRANT_E2E_WORKDIR"
          make e2e
      - name: process logs on failure
        if: failure()
        run: |
          find "${{ runner.temp }}/toolwarrant-e2e" -type f -path '*/logs/*' -print -exec cat {} \; 2>/dev/null || true

  requalify:
    name: re-qualify a candidate agentgateway release (dispatch with inputs only, L7)
    if: github.event_name == 'workflow_dispatch' && inputs.gateway_version != ''
    runs-on: ubuntu-latest
    env:
      GATEWAY_VERSION: ${{ inputs.gateway_version }}
      GATEWAY_SHA256: ${{ inputs.gateway_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, where the checked-out code could read it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The script validates both inputs before it uses them in a URL or a
      # path, downloads the candidate's linux asset, checks it against the
      # digest given and the one the release publishes, runs the binary-backed
      # tests and make e2e against it, and prints one PASS or CHANGED line per
      # item; exit 1 means at least one CHANGED or a failed test run.
      - name: scripts/requalify-gateway.sh --e2e
        run: scripts/requalify-gateway.sh "$GATEWAY_VERSION" "$GATEWAY_SHA256" --e2e
      # What the items read, for the operator: the scenario notes of the e2e
      # run and the head of every diff the script wrote. The e2e process logs
      # are printed only on failure, as the e2e job does.
      - name: notes and diffs
        if: always()
        run: |
          set -eu
          dir=".cache/candidate/$GATEWAY_VERSION"
          if [ -f "$dir/e2e-report.log" ]; then
            echo "## e2e notes"
            cat "$dir/e2e-report.log"
          fi
          for f in "$dir"/diffs/*.diff; do
            if [ -f "$f" ]; then
              echo "## $f (first 400 lines)"
              head -n 400 "$f"
            fi
          done
      - name: process logs on failure
        if: failure()
        run: |
          find ".cache/candidate/$GATEWAY_VERSION/e2e-work" -type f -path '*/logs/*' -print -exec cat {} \; 2>/dev/null || true
