# .goreleaser.yaml: how a v* tag becomes a draft GitHub release (D16).
# Only cmd/toolwarrant is released; the seam and mock binaries never are.
version: 2

project_name: toolwarrant

before:
  hooks:
    - go mod verify

builds:
  - id: toolwarrant
    main: ./cmd/toolwarrant
    binary: toolwarrant
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    ids:
      - toolwarrant
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# One SPDX document per archive, produced by syft (D16 (b)).
sboms:
  - id: archive-sboms
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# Keyless signature of the checksums file through the workflow's OIDC
# identity; the certificate is attached next to the signature (D16 (c)).
# The signature is one sigstore bundle (signature, certificate and
# transparency-log entry in a .sigstore.json file). cosign v3, which the
# pinned cosign-installer provides, writes bundles by default and ignores the
# separate --output-signature and --output-certificate files that cosign v2
# wrote, so a configuration naming those files signs nothing and the release
# fails when goreleaser looks for them (found by the review of 2026-10-12
# before v0.1.0-rc.3). Verification: cosign verify-blob --bundle.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^(?:[0-9a-f]+ )?feat(\([^)]*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^(?:[0-9a-f]+ )?fix(\([^)]*\))?!?:'
      order: 1
    - title: Performance
      regexp: '^(?:[0-9a-f]+ )?perf(\([^)]*\))?!?:'
      order: 2
    - title: Refactoring
      regexp: '^(?:[0-9a-f]+ )?refactor(\([^)]*\))?!?:'
      order: 3
    - title: Tests
      regexp: '^(?:[0-9a-f]+ )?test(\([^)]*\))?!?:'
      order: 4
    - title: Build and CI
      regexp: '^(?:[0-9a-f]+ )?(build|ci)(\([^)]*\))?!?:'
      order: 5
    - title: Documentation
      regexp: '^(?:[0-9a-f]+ )?docs(\([^)]*\))?!?:'
      order: 6
    # goreleaser matches these against '<abbreviated sha> <subject>' lines, so
    # every pattern allows the sha prefix; the last group has no regexp and
    # keeps whatever the others did not match, so no commit is dropped in
    # silence.
    - title: Other
      order: 99
  filters:
    exclude:
      - '^(?:[0-9a-f]+ )?chore'
      - '(?i)^(?:[0-9a-f]+ )?merge[: ]'

release:
  # The target is named so that goreleaser check works before the first
  # push and so that a fork never releases into another repository.
  github:
    owner: sairam0424
    name: toolwarrant
  draft: true
  replace_existing_draft: true
  prerelease: auto
  # keep-existing: a re-run of the workflow on a tag whose release was already
  # published leaves the published notes alone, and the existing assets make
  # the upload fail instead of swapping artefacts under a known version; a fix
  # needs a new tag (docs/operations.md, Releasing).
  mode: keep-existing
  header: |
    toolwarrant {{ .Version }} is tested against agentgateway v1.6.0 (pinned
    ExtMCP wire format and configuration schema) and writes catalog schema
    v6; a catalog from an earlier build is refused and must be re-initialised:
    stop the processors, back up the old file and record its audit head with the
    build that wrote it, keep the git export, then init, register, crawl and
    approve again (docs/operations.md, Recovering from ErrCorrupt and ErrSchema).
    Verify the checksums file before running a binary:
    docs/operations.md, section Releasing.
  footer: |
    Binaries are built from the tagged commit with CGO disabled and
    -trimpath; an SPDX SBOM produced by syft sits beside each archive
    (`<archive>.spdx.json`), and the checksums file is signed keyless with
    cosign by this repository's release workflow.
