# .goreleaser.yaml: how a v* tag becomes a draft GitHub release (D16).
# Only cmd/toolwarrant is released; the seam and mock binaries never are.
version: 2

project_name: toolwarrant

before:
  hooks:
    - go mod verify

builds:
  - id: toolwarrant
    main: ./cmd/toolwarrant
    binary: toolwarrant
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    ids:
      - toolwarrant
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# One SPDX document per archive, produced by syft (D16 (b)).
sboms:
  - id: archive-sboms
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# Keyless signature of the checksums file through the workflow's OIDC
# identity; the certificate travels inside the bundle (D16 (c)).
# The signature is one sigstore bundle (signature, certificate and
# transparency-log entry in a .sigstore.json file). cosign v3, which the
# pinned cosign-installer provides, writes bundles by default and ignores the
# separate --output-signature and --output-certificate files that cosign v2
# wrote, so a configuration naming those files signs nothing and the release
# fails when goreleaser looks for them (found by the review of 2026-10-12
# before v0.1.0-rc.3). Verification: cosign verify-blob --bundle.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum

# The release notes are the tag's section of CHANGELOG.md, which the release
# workflow writes with scripts/release-notes.sh and passes as
# `goreleaser release --release-notes FILE` (D20 (d)); the commit list grouped
# by type that stood here until v0.1.1 (D16 (d)) is gone. There is no
# changelog block on purpose: goreleaser v2.18.2 reads the --release-notes
# file inside its changelog pipe (internal/pipe/changelog, Run returns right
# after loading it), and `changelog: disable: true` skips that pipe, file
# included, so the release body would be the header and footer below around
# nothing. With the pipe enabled and the file given, no commit is listed; the
# header and footer are applied by the release pipe around the notes.
# internal/releaseguards pins both facts
# (TestReleaseNotes_theWorkflowHandsTheFileToGoreleaserAndKeepsThePipe).
# `make release-snapshot` skips the pipe, as every snapshot does.

release:
  # The target is named so that goreleaser check works before the first
  # push and so that a fork never releases into another repository.
  github:
    owner: sairam0424
    name: toolwarrant
  draft: true
  replace_existing_draft: true
  prerelease: auto
  # keep-existing: a re-run of the workflow on a tag whose release was already
  # published leaves the published notes alone, and the existing assets make
  # the upload fail instead of swapping artefacts under a known version; a fix
  # needs a new tag (docs/operations.md, Releasing).
  mode: keep-existing
  header: |
    toolwarrant {{ .Version }} is tested against agentgateway v1.6.0 (pinned
    ExtMCP wire format and configuration schema) and writes catalog schema
    v7; a catalog from an earlier build is migrated in place when it is schema v6 (v0.1.0 to v0.3.x) and refused otherwise.
    To migrate: stop the processors, back the file up and record its audit head
    with the build that wrote it, then run init (or any writing command) with
    this build, which adds one table and its guards and rewrites nothing, so
    the head is unchanged; then start the processors. A v0.3.x build refuses
    the migrated file as written by a newer build, and a read-only open
    (serve, audit verify, audit list) never migrates. A file from an
    unreleased build (schema v2 to v5) is refused and must be re-initialised
    (docs/operations.md, Recovering from ErrCorrupt and ErrSchema).
    Verify the checksums file before running a binary:
    docs/operations.md, section Releasing.
  footer: |
    Binaries are built from the tagged commit with CGO disabled and
    -trimpath; an SPDX SBOM produced by syft sits beside each archive
    (`<archive>.spdx.json`), the checksums file is signed keyless with
    cosign by this repository's release workflow, and the SLSA build
    provenance of the archives and SBOMs, signed by the same workflow, is
    the `toolwarrant_<version>_provenance.intoto.jsonl` asset
    (`gh attestation verify <archive> --repo sairam0424/toolwarrant`;
    SECURITY.md, Release integrity). The notes above are this version's
    section of CHANGELOG.md.
