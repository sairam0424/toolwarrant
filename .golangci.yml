# golangci-lint configuration (v2 format; the repository uses golangci-lint 2.13).
#
# Why this file exists: the default set is what reviewers already run by hand,
# and writing it down makes "lint clean" mean the same thing on every machine.
# No exclusions: an ignored error is written out as `_ = x.Close()` so that the
# decision is visible at the call site instead of hidden in a lint rule.
version: "2"

run:
  # The regression tests are part of the product; lint them like anything else.
  tests: true

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  # The three named below are already in that set; they are listed so that the
  # intent survives a change of the default.
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck

formatters:
  enable:
    - gofmt

issues:
  # Report everything. The defaults (50 per linter, 3 identical texts) truncate
  # the list and make a count from one run disagree with the next.
  max-issues-per-linter: 0
  max-same-issues: 0
